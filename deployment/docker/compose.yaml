services:
  personal_website_flask:
    container_name: personal_website_flask
    restart: unless-stopped
    ports:
      # SYNC: nginx and entrypoint gunicorn ports
      - "8080:8080"
    user: "$DOCKER_USER_STR"
    build:
      # must be parent; dockerfile can't access parent dirs
      context: ../../
      # SYNC: path, relative to `context`
      dockerfile: deployment/docker/flask/Dockerfile
      network: host
    # SYNC: env file paths
    env_file:
      - ./flask/.env
      - ./flask/.flaskenv
    volumes:
      # for persisting uploaded images in static folders
      - type: bind
        # SYNC: path
        source: ../../app/blog/static/blogpage/
        # SYNC: path, dockerfile `WORKDIR`
        target: /personal_website/app/blog/static/blogpage/
  personal_website_mysql:
    container_name: personal_website_mysql
    # SYNC: host's mysql version if using bind mount
    image: "mysql:8.0.37"
    restart: unless-stopped
    ports:
      - "3306:3306"
      - "33060:33060"
    user: "$DOCKER_USER_STR"
    volumes:
      # for persisting database
      - type: bind
        # SYNC: mysql data directory for persistence
        source: ./mysql/mysql_data_dir/
        target: /var/lib/mysql/
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
