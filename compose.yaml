include:
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_NGINX:?}/compose.yaml
  - ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_IOCAINE:?}/compose.yaml
  - ./deployment/anubis/compose.yaml

services:
  personal_website:
    container_name: personal_website
    extends:
      file: ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
      service: shared_sckts_user
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    build:
      # note that dockerfile cannot access directories above this
      context: ./
      # SYNC: path, relative to `context`
      dockerfile: deployment/docker/flask/Dockerfile
      # uncomment the following for better performance if using tcp/ip ports
      #network: host
      args:
        DOCKER_ROOT_USER: ${DOCKER_ROOT_USER:?}
        DOCKER_NONROOT_USER: ${DOCKER_NONROOT_USER:?}
    # this passes the socket to entrypoint script as an arg
    command: ${PERSONAL_WEBSITE_SCKT:?}
    restart: unless-stopped
    user: ${DOCKER_NONROOT_USER:?}
    volumes:
      # for persisting files uploaded from the web ui in static folders
      - type: bind
        # SYNC: path, relative to current path containing compose file
        source: ./app/blog/static/blogpage/
        # SYNC: path, inside container
        target: /personal_website/app/blog/static/blogpage/
    # SYNC: env file paths, relative to current path containing compose file
    env_file:
      - ./.env
      - ./deployment/docker/flask/.env
      - ./deployment/docker/flask/.flaskenv
    environment:
      DATABASE_URL: "mysql+pymysql://${PERSONAL_WEBSITE_MYSQL_USERNAME:?}\
                     :${PERSONAL_WEBSITE_MYSQL_PASSWORD:?}@localhost/\
                     ${PERSONAL_WEBSITE_MYSQL_DB_NAME:?}\
                     ?unix_socket=${PERSONAL_WEBSITE_MYSQL_SCKT:?}\
                     &charset=${PERSONAL_WEBSITE_MYSQL_CHARSET:?}"
    healthcheck:
      test: ["CMD", "curl", "-I", "https://${PERSONAL_WEBSITE_SITE_DOMAIN:?}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m
    depends_on:
      nginx:
        condition: service_healthy
      iocaine:
        condition: service_started
      personal_website_anubis:
        condition: service_healthy
      personal_website_mysql:
        condition: service_healthy

  personal_website_mysql:
    container_name: personal_website_mysql
    extends:
      file: ${PATH_TO_SERVER_ROOT:?}/${PATH_FROM_ROOT_TO_UTILS:?}/shared_sckts.yaml
      service: shared_sckts_user
    profiles:
      - ${DOCKER_DEFAULT_PROFILE:?}
    image: mysql:9.7
    # disable TCP/IP port and only use unix socket
    command: --skip-networking --socket=${PERSONAL_WEBSITE_MYSQL_SCKT:?}
    restart: unless-stopped
    user: ${DOCKER_NONROOT_USER:?}
    volumes:
      # for persisting database
      # SYNC: source path with mysql data directory on host
      - type: bind
        source: ./deployment/docker/mysql/mysql_data_dir/
        target: /var/lib/mysql/
    environment:
      # i think i created the root user with no password, so this is needed? idk
      # (gosh darn it why didn't i document things back then >~<)
      MYSQL_ALLOW_EMPTY_PASSWORD: 1
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-S", "${PERSONAL_WEBSITE_MYSQL_SCKT:?}", "-u", "root"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
